# What a release actually contains.
#
# Without this file electron-builder falls back to defaults — an app named after the package, no
# entitlements, and every workspace dependency copied in whether it is needed at runtime or not.
appId: dev.lyra.app
productName: Lyra
# The binary's own name, which is not always derived from productName.
#
# Linux takes it from the package name instead, and this package is called `@lyra/desktop` — so
# electron-builder produced `@lyradesktop`, refused it as a filename, and failed the AppImage. It
# only ever mattered on Linux, and nothing built Linux until the first release.
executableName: Lyra
# The filename of every artifact, spelled out.
#
# The default is `${name}…`, and `name` is the package's — `@lyra/desktop`. macOS and Windows
# happen to use `productName` in their defaults and were fine; Linux's .deb used the package name
# and tried to write `release/@lyra/desktop_0.2.0_amd64.deb`, where that slash is a directory
# separator. It produced no .deb and no error anyone would connect to a package name.
artifactName: ${productName}-${version}-${arch}.${ext}
copyright: Copyright © 2026 kittors

directories:
  output: release
  buildResources: build

# `out/` is what electron-vite produced; nothing else in the package belongs in the bundle.
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

# node-pty is a native addon: it cannot live inside the asar, because the OS has to be able to
# open the .node file by path.
asarUnpack:
  - "**/node_modules/node-pty/**"

# The status bar icons, which `Tray` loads by path at runtime and so cannot live in the asar.
# `files` above covers only `out/`, so without this the tray comes up blank in a packaged build
# while working perfectly in development — the icons are right there in the source tree.
#
# The two source drawings are excluded deliberately: they are 1.8MB of 1254px artwork that only
# `pnpm tray:icons` ever reads.
extraResources:
  - from: build/tray
    to: build/tray
    filter:
      - "*.png"
      - "!source-*.png"

# Each build keeps only its own copy of the per-platform prebuilts.
#
# `supportedArchitectures` in `pnpm-workspace.yaml` installs every platform's `koffi`, because a
# release job packages architectures its own machine is not — without it, the arm64 Windows
# installer took the x64 `koffi.node` the runner happened to need, which is the bug 0.8.35 shipped.
# The cost is that all six copies are then present at packaging time, and electron-builder copies
# production dependencies as it finds them: a macOS build would carry Windows and Linux binaries,
# around 8MB of code that platform can never load.
#
# Stated per platform rather than once, because `koffi` names its packages after Node's
# `process.platform` — `darwin`, `win32`, `linux` — and there is no macro for that. `${arch}` is
# expanded per build, so one pattern covers both architectures on each platform.
#
# These are `!` patterns, which is what reaches node_modules at all: positive patterns there are
# ignored, since production dependencies are included by default. `scripts/check-native-arch.mjs`
# runs after packaging and fails the build if a pattern here ever excludes the copy that was needed.
#
# `node-pty` is the other shape of the same thing: one package carrying `prebuilds/<os>-<cpu>/` for
# every platform it supports. Its loader tries `build/Release` first — which electron-builder
# compiles for the architecture being packaged — and only then the prebuilt for the running
# machine, so the other platforms' copies are dead weight that the arch check would otherwise have
# to explain away.
mac:
  files:
    - "!**/node_modules/@koromix/koffi-!(darwin-${arch})/**"
    - "!**/node_modules/node-pty/prebuilds/!(darwin-${arch})/**"
  category: public.app-category.developer-tools
  # Relative to `buildResources`, not to the project.
  #
  # This said `build/icon.icns`, and `buildResources` is already `build` — so it looked for
  # `build/build/icon.icns`, found nothing, and fell back to Electron's own icon without a word of
  # complaint. Every package ever built carried the default atom icon; nobody noticed because the
  # packages were never installed until the first release.
  icon: icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The app shells out, reads the projects you point it at, and talks to model endpoints.
  # Hardened runtime without these entitlements would stop all three.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc here, overridden with a real identity when one is available.
  #
  # This value is the floor, not the intent: `scripts/package.mjs` replaces it with the signing
  # identity whenever `CSC_LINK` is set, which is what the release workflow does. It stays written
  # down as `-` so that *every* path through electron-builder signs something — left unset,
  # electron-builder skips signing when it cannot discover an identity, and an unsigned bundle is
  # the "已损坏" dead end described below.
  #
  # **Why signing with any certificate matters, even a self-signed one.** macOS decides whether
  # two builds are the same application by their designated requirement. Ad-hoc, it is a hash of
  # the executable:
  #
  #     designated => cdhash H"ff1c876598ea614d4bc7fead3bb1c0d9c2c710a7"
  #
  # Every release changes the binary, so every release is a stranger: screen recording permission
  # revoked, keychain entries unreadable, everything authorised again. With a certificate the
  # requirement names the certificate instead —
  #
  #     designated => identifier "dev.lyra.app" and certificate leaf = H"…"
  #
  # — and says nothing about the executable, so an update is the same app. Confirmed by signing two
  # unrelated binaries with one certificate: byte-identical requirements. See
  # `scripts/make-signing-cert.sh`, which generates one without an Apple Developer account.
  #
  # What a self-signed certificate does not buy is notarization, which needs the paid account. A
  # download from a browser still meets 「未识别的开发者」 on first install; updates do not, because
  # they replace the bundle in place and never carry a quarantine flag.
  #
  # Ad-hoc remains the fallback rather than `null` — "skip signing" — because skipping is worse
  # than it sounds. Electron's binary arrives linker-signed with sealed resources declared;
  # electron-builder renames it, rewrites Info.plist and packs our resources beside it, and with
  # signing skipped nothing re-seals any of that. `codesign --verify` says it plainly:
  #
  #     code has no resources but signature indicates they must be present
  #
  # Quarantined, Gatekeeper finds a broken signature and reports 「Lyra.app 已损坏，无法打开。」 — a
  # dead end, that dialog has no 「仍要打开」. Ad-hoc is rejected as merely unidentified instead,
  # which does offer a way through. The entitlements already carry `disable-library-validation`,
  # which ad-hoc signing needs to launch at all.
  identity: "-"

win:
  # See the note above `mac`.
  files:
    - "!**/node_modules/@koromix/koffi-!(win32-${arch})/**"
    - "!**/node_modules/node-pty/prebuilds/!(win32-${arch})/**"
  icon: icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  # See the note above `mac`.
  files:
    - "!**/node_modules/@koromix/koffi-!(linux-${arch})/**"
    - "!**/node_modules/node-pty/prebuilds/!(linux-${arch})/**"
  icon: icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Electron 的 fuses：**试过，没能验证，所以没有开。**
#
# `electronFuses:` 写进这个文件之后，electron-builder 确实执行了（日志里有
# `executing @electron/fuses`），但打出来的包用 `@electron/fuses` 的 API 读回去，八个位全是
# 关——包括配成 `true` 的那三个。而与此同时 `ELECTRON_RUN_AS_NODE=1 ./Lyra` 仍然能起 Node，
# 说明那些位根本没写进二进制，读到的「全关」是未初始化的默认值，不是生效后的状态。
#
# 也就是说：配了它，既得不到保护，也没有办法确认得到了什么。而 fuse 是一次性的——发出去的版本
# 里若有一位错了，只能靠发下一个版本盖掉。这种东西不能凭「配置看起来对」就交付。
#
# 真要开的话，缺的是这两步：查清 electron-builder 26.15.3 与 Electron 43 在 fuse wire 长度上
# 的对应关系（`the fuse wire in this version of Electron is not long enough` 是这一带已知的
# 报错），以及三平台各自读回验证。
#
# 另外 `runAsNode` 无论如何要保持开着：`core/src/sandbox/backend.ts` 用
# `ELECTRON_RUN_AS_NODE=1` + `process.execPath` 起沙箱 runner，Windows 的受限令牌沙箱建在它
# 上面。关掉它不是削弱沙箱，是沙箱起不来。见 ADR-0018。

publish: null
