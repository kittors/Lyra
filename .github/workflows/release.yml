# Cut a release: build on each platform's own runner, then publish it.
#
# Published rather than drafted, which is a change and worth the sentence. Drafting was meant to
# leave room to read the notes before anyone downloaded anything — in practice it left four
# releases sitting as drafts (0.4.0, 0.4.1, 0.5.0, 0.6.1), each with every artifact built and
# uploaded and none of them reachable. An app that checks for updates skips drafts, so those were
# releases that had shipped nothing: the last step is a manual one, and manual last steps get
# forgotten.
#
# The tag is what triggers this, and pushing a tag is already the decision to release. Notes can
# still be edited afterwards; a release that nobody can download cannot be fixed by editing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything up to and including the artifacts. Identical to what the dry run rehearses, because
  # it is literally the same file — see `_desktop-build.yml`.
  build:
    uses: ./.github/workflows/_desktop-build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      # Fatal here, unlike in the rehearsal. An ad-hoc build revokes every permission on every
      # machine that installs it, and a published release cannot be taken back.
      require-signing: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The digests every client checks before it installs.
      #
      # Not the same file the build job wrote — that one covers a single platform's output and is
      # there to prove the step works. This is the one that ships: every artifact from all three
      # runners, in one list a person can also check by hand.
      #
      # `update-checksum.ts` reads it back. A release without it downloads and then refuses to
      # install, which is the intended behaviour for a release nobody can verify.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The notes, out of CHANGELOG.md.
      #
      # They used to be `git log` piped into the release body: every commit, in full, including the
      # ones about lockfiles and CI. That is a log, not notes — and it made the notes worth skipping,
      # which is a shame for the entries that did matter.
      #
      # `pnpm release` writes that section before it tags, so the file people edit is the file
      # people see. The tag message carries the same text; falling back to it covers a tag pushed by
      # hand.
      - name: Notes from the changelog
        id: notes
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          {
            echo "notes<<LYRA_EOF"
            node scripts/changelog-section.mjs "$tag" 2>/dev/null \
              || git tag -l --format='%(contents)' "$tag" \
              || echo "见提交历史。"
            echo "LYRA_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*
          draft: false
          fail_on_unmatched_files: true
