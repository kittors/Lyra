# Everything a release does, except releasing.
#
# A tag is a decision, and until this existed it was also the first time anyone found out whether
# the thing could be built at all. `pnpm test` runs constantly; `pnpm package` ran nowhere — so a
# packaging fault (an `executableName` Linux would not accept, in the event) sat in the repository
# for as long as it liked and surfaced as a failed release, with the tag already pushed.
#
# Same runners, same steps, same order as `release.yml`, up to but not including the publish —
# guaranteed by the two of them calling the same workflow rather than by two copies being kept in
# step by hand. Run it before tagging: green here means the tag will build.
#
# `pnpm release` checks that this ran on the exact commit being tagged. That check is the reason it
# is worth having: a rehearsal nobody remembers to run is not a rehearsal.
name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to rehearse (defaults to the current branch)
        required: false

permissions:
  contents: read

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_desktop-build.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      # A warning rather than a failure: a rehearsal without the secrets should still rehearse the
      # packaging, which is most of what can go wrong.
      require-signing: false
    secrets: inherit
