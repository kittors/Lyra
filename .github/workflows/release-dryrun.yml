# Everything a release does, except releasing.
#
# A tag is a decision, and until this existed it was also the first time anyone found out whether
# the thing could be built at all. `pnpm test` runs constantly; `pnpm package` ran nowhere — so a
# packaging fault (an `executableName` Linux would not accept, in the event) sat in the repository
# for as long as it liked and surfaced as a failed release, with the tag already pushed.
#
# Same runners, same steps, same order as `release.yml`, up to but not including the publish. Run
# it before tagging: green here means the tag will build.
name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to rehearse (defaults to the current branch)
        required: false

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup
        with:
          # Packaging needs Electron's binary, so it must not depend on which job warmed the store.
          cache: "false"
          electron: "true"

      - name: Verify before building
        run: pnpm lint && pnpm typecheck && pnpm test

      # Signing is here for the same reason packaging is: it is the step most likely to be broken
      # in a way nothing else notices. A certificate that fails to import leaves a build that works
      # perfectly and quietly resets every permission on the machine it lands on — exactly the class
      # of fault this workflow exists to catch before a tag is pushed. Kept identical to
      # `release.yml`; see the comments there for why each line is needed.
      - name: Prepare the signing identity
        if: matrix.os == 'macos-latest'
        # See `release.yml`: one of these can hang on a dialog rather than fail.
        timeout-minutes: 5
        run: |
          if [ -z "$MAC_CERTIFICATE_P12" ]; then
            echo "::warning::MAC_CERTIFICATE_P12 is not set — this build will be ad-hoc signed"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/lyra-signing.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          openssl pkcs12 -legacy -in "$RUNNER_TEMP/certificate.p12" -passin "pass:$MAC_CERTIFICATE_PASSWORD" \
            -clcerts -nokeys -out "$RUNNER_TEMP/certificate.pem"
          # sudo and the system keychain: the user domain waits on a dialog. See `release.yml`.
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/certificate.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/certificate.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Build and package
        run: pnpm package
        env:
          GH_TOKEN: ""

      - name: Check the macOS build signed durably
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          APP=$(find packages/desktop/release -maxdepth 2 -name 'Lyra.app' -print -quit)
          if [ -z "$APP" ]; then echo "::error::no Lyra.app in the release output"; exit 1; fi
          REQUIREMENT=$(codesign -d -r- "$APP" 2>&1 | tail -1)
          echo "$REQUIREMENT"
          case "$REQUIREMENT" in
            *"certificate leaf"*)
              echo "signed with a durable identity: updates keep their permissions" ;;
            *cdhash*)
              if [ -z "$MAC_CERTIFICATE_P12" ]; then
                echo "::warning::ad-hoc signed, as expected without a certificate"
              else
                echo "::error::ad-hoc signed despite a certificate being present — the import or the identity name is wrong"
                exit 1
              fi ;;
            *)
              echo "::error::unrecognised designated requirement"
              exit 1 ;;
          esac

      # Named, not uploaded. What matters is that they exist and that the build got this far; the
      # artifacts themselves are what the real release is for.
      - name: What came out
        shell: bash
        run: ls -lh packages/desktop/release/ | grep -Ev '^total|\.blockmap|builder-' || true

      # The same digest step the real release runs, on this platform's own artifacts.
      #
      # Rehearsed rather than assumed: the client refuses to install an update whose checksum it
      # cannot verify, so a `sha256sum` that is missing or misbehaving here would surface as
      # "更新装不上" after a tag is already pushed — which is exactly the class of failure this
      # workflow exists to catch first.
      - name: Checksums, as the release would write them
        shell: bash
        working-directory: packages/desktop/release
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::没有产物可以校验"; exit 1; fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
