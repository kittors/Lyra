# Everything a release does, except releasing.
#
# A tag is a decision, and until this existed it was also the first time anyone found out whether
# the thing could be built at all. `pnpm test` runs constantly; `pnpm package` ran nowhere — so a
# packaging fault (an `executableName` Linux would not accept, in the event) sat in the repository
# for as long as it liked and surfaced as a failed release, with the tag already pushed.
#
# Same runners, same steps, same order as `release.yml`, up to but not including the publish. Run
# it before tagging: green here means the tag will build.
name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to rehearse (defaults to the current branch)
        required: false

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup
        with:
          # Packaging needs Electron's binary, so it must not depend on which job warmed the store.
          cache: "false"
          electron: "true"

      - name: Verify before building
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build and package
        run: pnpm package
        env:
          GH_TOKEN: ""

      # Named, not uploaded. What matters is that they exist and that the build got this far; the
      # artifacts themselves are what the real release is for.
      - name: What came out
        shell: bash
        run: ls -lh packages/desktop/release/ | grep -Ev '^total|\.blockmap|builder-' || true
