# Issues that stopped moving.
#
# The point is not tidiness. An issue list where half the entries are questions nobody can answer
# any more is a list people stop reading — and then the real reports get missed too.
#
# Nothing is closed without warning, and anything labelled `pinned` or `security` is left alone
# however long it sits.
name: Issue lifecycle

on:
  schedule:
    # Once a week, early Monday UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,confirmed
          stale-issue-message: |
            这个 issue 已经 60 天没有动静了。

            如果问题还在，回复一句就行——说明它仍然重要，标签会自动去掉。
            两周内没有回复的话会先关掉，不代表不认；随时可以重开。
          close-issue-message: |
            没有进一步的信息，先关掉了。

            如果还能复现，欢迎带上复现步骤重开这个 issue。

          # A pull request that has gone quiet usually needs a decision, not a nudge — so they
          # are marked but never closed automatically.
          days-before-pr-stale: 30
          days-before-pr-close: -1
          stale-pr-label: stale
          exempt-pr-labels: pinned,wip
          stale-pr-message: |
            这个 PR 30 天没有更新了。还在做的话回复一句；如果在等评审，也说一声。

          operations-per-run: 100
          ascending: true
