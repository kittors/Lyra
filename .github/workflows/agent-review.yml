# The repository reviews its own pull requests, using the agent it is.
#
# Not a third-party review bot: this runs `packages/agent-cli`, which builds the same
# `AgentSession` the desktop app builds. If the review is bad, that is a fact about this codebase
# worth knowing — which is most of the reason to do it this way.
#
# The agent gets read-only tools and a read-only token. It comments; it never approves, never
# requests changes, never pushes.
name: Agent review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Three things this does not review, each for its own reason:
    #
    # Dependabot — a model has nothing useful to say about a version bump, and those pull
    # requests do not carry the secrets this needs anyway.
    #
    # Drafts — a draft is by definition not finished being written.
    #
    # Forks — `pull_request_target` hands secrets to a workflow triggered by someone else's
    # branch. The checkout below is of our own base ref and the diff is read through the API, so
    # no untrusted code runs; but a fork's pull request is exactly where a mistake in that
    # reasoning would cost the most, so it is left to a human until this repository actually
    # takes external contributions.
    if: >-
      github.actor != 'dependabot[bot]'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: ./.github/actions/setup

      - name: Review
        # Skipped rather than failed when the model is not configured: a repository without these
        # secrets is a repository that has not turned this on, which is not an error.
        env:
          LYRA_BASE_URL: ${{ secrets.LYRA_BASE_URL }}
          LYRA_API_KEY: ${{ secrets.LYRA_API_KEY }}
          LYRA_MODEL: ${{ vars.LYRA_MODEL || 'deepseek-v4-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$LYRA_API_KEY" ] || [ -z "$LYRA_BASE_URL" ]; then
            echo "::notice::LYRA_API_KEY / LYRA_BASE_URL 未配置，跳过 agent 审查"
            exit 0
          fi
          node --experimental-strip-types packages/agent-cli/src/main.ts review "${{ github.event.pull_request.number }}"
