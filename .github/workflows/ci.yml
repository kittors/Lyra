# Everything that has to be true before a change lands.
#
# The jobs are split so a failure names itself: "lint" and "typecheck" and "test" fail for
# different reasons and are fixed by different people at different times. `all-green` is the one
# check branch protection points at, so adding a job here does not mean editing a setting there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that gets a new push does not need the old run finished. A push to main does:
# each commit on the default branch is a candidate for release and deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    # Both platforms, but not on every push.
    #
    # The agent shells out and touches the filesystem — path handling, scratch directories and the
    # risk classifier genuinely differ on macOS — so the second platform is worth having. It is not
    # worth having ten times a day: a macOS minute costs ten times a Linux one against the account's
    # allowance, and this repository exhausted a month of it in an afternoon of pushes. So macOS
    # runs where a second opinion actually changes a decision (a pull request, a tag, a manual run)
    # and Linux runs everywhere.
    #
    # Windows runs everywhere too, despite costing double, because it is the platform that breaks
    # differently rather than merely again: `\` for a separator, `USERPROFILE` instead of `HOME`,
    # case-insensitive paths. Every one of those is invisible on the other two and none of them is
    # the kind of thing anyone catches by reading. Leaving it out of the push matrix is how a
    # release came to be the first thing that ever ran the tests there — and it failed, on code
    # that had been green for weeks.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    # macOS only: the runner there has a display, and this starts a real window. Linux would need
    # xvfb, which is one more moving part for a check that is already covered on one platform.
    #
    # Skipped on a plain push for the same reason as the macOS unit tests — it is the single most
    # expensive job here (a real Electron install plus a real window, on the 10x platform).
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # This one launches a real Electron window; see the inputs' own notes.
          cache: "false"
          electron: "true"
      - run: pnpm build
      - run: pnpm test:e2e

  dead-code:
    # Reported, not enforced. Knip is right often enough to be worth reading and wrong often
    # enough that failing a pull request on it would teach people to ignore it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `--no-exit-code`, so the report lands in the log without turning the run red for
      # something that is advisory by design.
      - run: pnpm knip --no-exit-code

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-build
          path: packages/desktop/out
          retention-days: 7

  # The single required check. Everything above must pass; `dead-code` is deliberately not here.
  all-green:
    if: always()
    needs: [lint, typecheck, test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        # `skipped` is a pass. e2e does not run on a push, and a verdict that treated "did not run"
        # as "did not succeed" would make every push to main red for a job nobody asked to run.
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
