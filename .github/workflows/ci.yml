# Everything that has to be true before a change lands.
#
# The jobs are split so a failure names itself: "lint" and "typecheck" and "test" fail for
# different reasons and are fixed by different people at different times. `all-green` is the one
# check branch protection points at, so adding a job here does not mean editing a setting there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that gets a new push does not need the old run finished. A push to main does:
# each commit on the default branch is a candidate for release and deserves its own verdict.
# Read-only by default; a job that needs more says so itself.
#
# Without this the token carries whatever the repository's default is, which is a setting that can
# change without anyone touching this file — and every job here only ever reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    # Both platforms, but not on every push.
    #
    # The agent shells out and touches the filesystem — path handling, scratch directories and the
    # risk classifier genuinely differ on macOS — so the second platform is worth having. It is not
    # worth having ten times a day: a macOS minute costs ten times a Linux one against the account's
    # allowance, and this repository exhausted a month of it in an afternoon of pushes. So macOS
    # runs where a second opinion actually changes a decision (a pull request, a tag, a manual run)
    # and Linux runs everywhere.
    #
    # Windows runs everywhere too, despite costing double, because it is the platform that breaks
    # differently rather than merely again: `\` for a separator, `USERPROFILE` instead of `HOME`,
    # case-insensitive paths. Every one of those is invisible on the other two and none of them is
    # the kind of thing anyone catches by reading. Leaving it out of the push matrix is how a
    # release came to be the first thing that ever ran the tests there — and it failed, on code
    # that had been green for weeks.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e-scope:
    # Dependabot opens several PRs at once. Desktop e2e is the expensive job (real Electron on
    # macOS, 10×). An Expo bump does not need it; an Electron bump does. This job is the cheap
    # filter so the macOS runner is not even requested. A hang here used to burn six hours per
    # PR because the e2e job had no timeout of its own.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        if: github.actor == 'dependabot[bot]'
        with:
          fetch-depth: 0
      - id: gate
        name: Decide whether desktop e2e is in scope
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$ACTOR" != "dependabot[bot]" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(packages/desktop/|packages/core/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # macOS only: the runner there has a display, and this starts a real window. Linux would need
    # xvfb, which is one more moving part for a check that is already covered on one platform.
    #
    # Skipped on a plain push for the same reason as the macOS unit tests — it is the single most
    # expensive job here (a real Electron install plus a real window, on the 10x platform).
    #
    # timeout-minutes is the last backstop. A full run is ~21 minutes; GitHub's default is 360.
    # A hung Electron used to sit until that default, three Dependabot PRs at a time.
    needs: e2e-scope
    if: github.event_name != 'push' && needs.e2e-scope.outputs.run == 'true'
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # This one launches a real Electron window; see the inputs' own notes.
          cache: "false"
          electron: "true"
      - run: pnpm build
      - run: pnpm test:e2e

  audit:
    # Known vulnerabilities in what actually ships.
    #
    # `--prod` on purpose: electron-builder's own dependency tree runs on a build machine and never
    # reaches a user, and failing a pull request on it would train people to skip the whole check.
    # What is left is what gets installed on somebody's laptop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  pr-title:
    # The title becomes the commit subject on a squash merge, so it has the same job as a commit
    # message: it is what the changelog is generated from. `commitlint` checks the local one and
    # cannot see this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            revert
          # Scope is filing information; a missing one is not worth blocking a pull request over.
          requireScope: false
          # Chinese subjects, so the English casing rules do not apply.
          subjectPattern: ".+"

  arch:
    # The dependency rules, checked. `.dependency-cruiser.cjs` says what each one is for.
    #
    # The rules that are `error` are the ones with no violations today: core stays platform-free, the
    # renderer does not link against the main process, `shared/` belongs to neither, the relay stays
    # dependency-free. Those cannot regress without this going red.
    #
    # Circular imports are `warn` — there are fifty-odd, the application works, and turning them red
    # on arrival would have meant untangling all of them before any other rule could be enforced.
    # The count is in the output; it is meant to go down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm arch

  dead-code:
    # Reported, not enforced. Knip is right often enough to be worth reading and wrong often
    # enough that failing a pull request on it would teach people to ignore it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `--no-exit-code`, so the report lands in the log without turning the run red for
      # something that is advisory by design.
      - run: pnpm knip --no-exit-code

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-build
          path: packages/desktop/out
          retention-days: 7

  mobile-bundle:
    # Does the phone app still bundle?
    #
    # `pnpm build` covers core and desktop; mobile had only a typecheck, and a typecheck cannot see
    # the thing that actually breaks there. A React Native bump to 0.87 passed lint, typecheck and
    # the tests on all three platforms, and `expo export` failed outright on it — `@expo/metro-config`
    # still requires `react-native/rn-get-polyfills`, which 0.87 removed. Nothing in the package
    # manager objects either: `expo`'s peer range for react-native is `*`, so the SDK's real version
    # pairing is enforced by neither npm nor tsc. Only bundling says so.
    #
    # `export`, not a simulator: this is the JS bundle, so it needs no Xcode and no Android SDK and
    # runs on the cheap platform in about a minute. The output is thrown away — the question being
    # asked is whether Metro can resolve and transform the whole graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lyra/mobile exec expo export --platform ios --output-dir /tmp/mobile-bundle

  # The single required check. Everything above must pass; `dead-code` is deliberately not here.
  all-green:
    if: always()
    needs: [lint, typecheck, test, build, e2e, e2e-scope, mobile-bundle, arch, audit, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        # `skipped` is a pass. e2e does not run on a push, and a verdict that treated "did not run"
        # as "did not succeed" would make every push to main red for a job nobody asked to run.
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }} e2e-scope=${{ needs.e2e-scope.result }}"
          echo "mobile-bundle=${{ needs.mobile-bundle.result }} arch=${{ needs.arch.result }}"
          echo "audit=${{ needs.audit.result }} pr-title=${{ needs.pr-title.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
