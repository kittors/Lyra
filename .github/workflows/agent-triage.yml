# A new issue gets read before anyone has time to read it.
#
# Two outcomes only: an area label, and a note saying what the report is missing. The agent does
# not decide whether something is a real defect and does not close anything — those are judgements
# about the code, made by someone who can then go and fix it.
name: Agent triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Triage
        # Skipped rather than failed when the model is not configured; see agent-review.yml.
        env:
          LYRA_BASE_URL: ${{ secrets.LYRA_BASE_URL }}
          LYRA_API_KEY: ${{ secrets.LYRA_API_KEY }}
          LYRA_MODEL: ${{ vars.LYRA_MODEL || 'deepseek-v4-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$LYRA_API_KEY" ] || [ -z "$LYRA_BASE_URL" ]; then
            echo "::notice::LYRA_API_KEY / LYRA_BASE_URL 未配置，跳过 agent 分类"
            exit 0
          fi
          node --experimental-strip-types packages/agent-cli/src/main.ts triage "${{ github.event.issue.number || inputs.issue }}"
