# TEMPORARY — a fast Windows check of the sandbox tests while the confined shell moves to PowerShell. Remove before merging.
name: diag-landlock

on:
  push:
    branches: [fix/shell-stability]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: sandbox and shell tests
        shell: bash
        working-directory: packages/core
        run: node --test --import ./test/setup.ts --experimental-strip-types test/sandbox-windows.test.ts test/sandbox-bash.test.ts test/escalation.test.ts test/sandbox-backend.test.ts test/command-shell.test.ts test/windows-acl-layout.test.ts test/read-access.test.ts test/background-jobs.test.ts test/system-prompt-snapshot.test.ts
