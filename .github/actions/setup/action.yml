# One description of "how this repo is prepared", used by every job.
#
# It exists so that the Node version, the pnpm version and the store cache are stated once. Five
# jobs each with their own copy is five places to forget when the Node version moves.
name: Setup
description: Node, pnpm and a warm store

inputs:
  cache:
    description: |
      Restore the pnpm store. Turn it off for a job that has to launch Electron.

      The store cache is keyed on the lockfile, and the jobs that never launch anything can
      populate it without Electron's binary in it. A later job then "installs" successfully —
      lockfile unchanged, nothing to do — finds no binary, and fails minutes later with
      "Error: Electron uninstall" and no window: a failure with nothing to do with the change
      being tested. A cold install costs about a minute, which is the cheaper side of that trade.
    required: false
    default: "true"

  electron:
    description: Make sure Electron's binary is installed. Needed to launch or package the app.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install
      shell: bash
      # Frozen, so a pull request cannot quietly change what is installed without changing the
      # lockfile. Scripts are allowed to run: node-pty has to build for the tests to import it.
      run: pnpm install --frozen-lockfile

    - name: Electron's binary
      if: inputs.electron == 'true'
      shell: bash
      # Run its installer by hand, because pnpm does not.
      #
      # The install log on a runner shows node-pty's postinstall and nothing else: Electron's own
      # never fires, so `path.txt` — the file every launcher reads — is never written, and
      # `electron-vite preview` dies with "Error: Electron uninstall" ninety seconds before the
      # first assertion. `install.js` is exactly what the postinstall would have run, and it exits
      # immediately when the binary is already there.
      run: |
        for dir in node_modules/.pnpm/electron@*/node_modules/electron; do
          if [ -f "$dir/path.txt" ]; then
            continue
          fi
          ok=
          for attempt in 1 2 3 4 5; do
            if (cd "$dir" && node install.js); then
              ok=1
              break
            fi
            echo "electron install attempt ${attempt} failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          [ -n "$ok" ]
        done
        compgen -G "node_modules/.pnpm/electron@*/node_modules/electron/path.txt" > /dev/null
