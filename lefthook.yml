# Git hooks, so that lint and typecheck are not optional.
#
# The split is deliberate: pre-commit only touches what you staged and has to stay fast enough that
# you never start reaching for `--no-verify`; pre-push runs the whole thing, because that is the
# last moment a mistake is still cheap to fix.
#
# Installed by `pnpm install` (the root `prepare` script). To skip one deliberately:
#   LEFTHOOK=0 git commit …

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,mts,cts,mjs,js,jsx}"
      run: ./node_modules/.bin/oxlint --fix {staged_files}
      stage_fixed: true

    - name: style
      glob: "*.css"
      run: ./node_modules/.bin/stylelint --fix {staged_files}
      stage_fixed: true

    - name: whitespace
      # Trailing whitespace and conflict markers, straight from git.
      run: git diff --cached --check

# The message itself, checked before it becomes a commit.
#
# Cheap enough not to notice — commitlint on one line of text — and it is the only moment the
# message can still be fixed without a rebase.
commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test

    - name: arch
      # Two seconds, and it answers the one question a type checker cannot: not "does this compile"
      # but "is this allowed to import that".
      run: pnpm arch
